services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: moovie
      POSTGRES_PASSWORD: moovie_prod_password
      POSTGRES_DB: moovie
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moovie -d moovie"]
      interval: 5s
      timeout: 5s
      retries: 10

  moovie-web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_PROVIDER: postgresql
      DATABASE_URL: postgresql://moovie:moovie_prod_password@postgres:5432/moovie?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: moovie-production-secret-change-me
      AUTH_SECRET: moovie-production-secret-change-me
    ports:
      - "3000:3000"

volumes:
  postgres_data:
